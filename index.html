<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>貨幣帳本</title>
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <!-- 安裝到手機主畫面（PWA / iPhone） -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="貨幣帳本">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
  <script>
    // 在畫面出現前套用主題，避免閃爍
    (function () {
      var t = null, open = false;
      try { var u = JSON.parse(localStorage.getItem('gct:ui:v1') || '{}'); t = u.theme; open = !!u.railOpen; } catch (e) { /* ignore */ }
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (open) document.documentElement.classList.add('rail-open');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar glass" id="topbar">
      <a class="brand" href="#/dashboard" aria-label="貨幣帳本首頁">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v5.5c0 1.7 3.1 3 7 3s7-1.3 7-3V6.5"/><path d="M5 12v5.5c0 1.7 3.1 3 7 3s7-1.3 7-3V12"/></svg></span>
        <span class="brand-text"><strong>貨幣帳本</strong><small>多帳號收益追蹤</small></span>
      </a>
      <div class="topbar-center" id="topCenter"></div>
      <div class="topbar-actions" id="topActions"></div>
    </header>

    <aside class="rail" aria-label="主選單">
      <div class="rail-pill theme-sw" id="themeSwitch"></div>
      <nav class="rail-pill nav" id="nav"></nav>
      <div class="rail-pill rail-foot" id="railFoot"></div>
    </aside>

    <main class="main" id="main">
      <div id="globalBanner"></div>
      <div class="page-head" id="pageHead">
        <div class="page-head-text">
          <p class="eyebrow" id="pageEyebrow"></p>
          <h1 id="pageTitle">載入中</h1>
          <p class="page-sub" id="pageSub"></p>
        </div>
        <div class="page-actions" id="pageActions"></div>
      </div>
      <div id="view" class="view">
        <div class="skeleton-grid" aria-label="載入中">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          <div class="skeleton tall"></div>
        </div>
      </div>
      <noscript><p class="noscript">這個工具需要啟用 JavaScript。</p></noscript>
    </main>

    <nav class="tabbar glass" id="tabbar" aria-label="主選單"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
